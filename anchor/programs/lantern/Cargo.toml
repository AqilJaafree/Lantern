[package]
name = "lantern"
version = "0.1.0"
description = "Lantern: mint gate for tokenized stocks, enforced by signed backing attestations"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lantern"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
